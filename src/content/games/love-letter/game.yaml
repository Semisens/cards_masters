# yaml-language-server: $schema=../../game.schema.json
# Love Letter : configuration complète du jeu. Modèle commenté : docs/modele-jeu.yaml.

id: love-letter
name: Love Letter
font: { file: great-vibes.woff2, family: Great Vibes, weight: 400, band_size: 4 }
background_color: rouge
tagline: Une lettre. Une princesse. Un seul gagnant.
description: >-
  Tu gardes une seule carte en main. Chaque tour, tu en piocheras une autre et tu joues l’une des deux. Devine,
  espionne, élimine tes rivaux. Fais parvenir ta lettre avant les autres.
players: { min: 2, max: 4 }
duration_min: 20
group_word: Carte
classic_forbidden_terms: [Garde, Prêtre, Baron, Servante, Comtesse]

# Cartes à garder (17). Une ligne de « Tes cartes » par personnage du jeu d'origine.
card_groups:
  - label: Valets et rois noirs
    cards:
      - { ranks: [J], suits: all }
      - { ranks: [K], suits: [spades, clubs] }
    display: { rank: J, suit: hearts }
    short: Devine la carte d’un rival.
    detail:
      title: Devine la carte d’un rival.
      text: Choisis un rival. Dis une valeur de 2 à 8. S’il a cette carte, il est éliminé.
    expert:
      original: '1'
      name: Garde
      power: deviner la carte d’un joueur pour l’éliminer

  - label: '2'
    cards:
      - { ranks: [2], suits: [hearts, spades] }
    display: { rank: 2, suit: spades }
    short: Regarde sa main.
    detail:
      title: Regarde sa main.
      text: Choisis un rival. Il te montre sa carte. Ne la répète à personne.
    expert:
      original: '2'
      name: Prêtre
      power: voir la main d’un joueur

  - label: '3'
    cards:
      - { ranks: [3], suits: [hearts, spades] }
    display: { rank: 3, suit: hearts }
    short: Compare. La plus faible sort.
    detail:
      title: Compare. La plus faible sort.
      text: >-
        Choisis un rival. Compare ta carte avec la sienne, en secret. La plus faible est éliminée. Égalité : personne
        ne sort.
    expert:
      original: '3'
      name: Baron
      power: comparer sa main avec celle d’un joueur

  - label: '4'
    cards:
      - { ranks: [4], suits: [hearts, spades] }
    display: { rank: 4, suit: spades }
    short: Tu es protégé un tour.
    detail:
      title: Tu es protégé un tour.
      text: Jusqu’à ton prochain tour, personne ne peut te choisir. Les pouvoirs des autres cartes ne t’atteignent pas.
    expert:
      original: '4'
      name: Servante
      power: être protégé jusqu’à son prochain tour

  - label: '5'
    cards:
      - { ranks: [5], suits: [hearts, spades] }
    display: { rank: 5, suit: hearts }
    short: Un joueur défausse sa carte.
    detail:
      title: Un joueur défausse sa carte.
      text: >-
        Choisis un joueur, toi compris. Il défausse sa carte et en pioche une nouvelle. S’il défausse le 8, il est
        éliminé.
    expert:
      original: '5'
      name: Prince
      power: faire défausser la carte d’un joueur

  - label: '6'
    cards:
      - { ranks: [6], suits: [spades] }
    short: Échange ta main.
    detail:
      title: Échange ta main.
      text: Choisis un rival. Échange ta carte contre la sienne, en secret.
    expert:
      original: '6'
      name: Roi
      power: échanger sa main avec celle d’un joueur

  - label: '7'
    cards:
      - { ranks: [7], suits: [hearts] }
    short: À jouer avec le 5 ou le 6.
    detail:
      title: À jouer avec le 5 ou le 6.
      text: Si tu as aussi un 5 ou un 6 en main, tu dois jouer le 7. Il n’a aucun autre effet.
    expert:
      original: '7'
      name: Comtesse
      power: devoir être jouée avec le Roi ou le Prince

  - label: '8'
    cards:
      - { ranks: [8], suits: [spades] }
    short: Si tu la défausses, tu sors.
    detail:
      title: Si tu la défausses, tu sors.
      text: Conserve-la jusqu’à la fin. Si tu la défausses, pour quelque raison que ce soit, tu es éliminé.
    expert:
      original: '8'
      name: Princesse
      power: éliminer celui qui la défausse

# Partie en manches : le gagnant d'une manche prend un jeton. 7, 5 ou 4 jetons pour gagner à 2, 3 ou 4 joueurs.
scoring:
  unit: point
  party_label: Manche {round}
  title: Fin de la manche {round}
  question: Qui a gagné des points ?
  validate: Valider la manche
  target: { 2: 7, 3: 5, 4: 4 }

tutorial:
  setup:
    title: Mise en place
    diagram:
      - label: Pioche
      - label: Écartée, cachée
      - label: Visibles (2 joueurs)
        card: { rank: J, suit: hearts }
    steps:
      - Mélange les {cards} cartes.
      - Écarte la première, face cachée.
      - À 2 joueurs, pose 3 cartes face visible.
      - Donne 1 carte à chaque joueur.
      - Le reste forme la pioche.
  turn:
    title: Un tour de jeu
    steps:
      - label: Pioche.
        text: Prends la carte du dessus.
      - label: Joue.
        text: Pose une de tes deux cartes, face visible.
      - label: Applique.
        text: Fais ce que dit la carte.
      - label: Passe.
        text: C’est au joueur suivant.
    win:
      title: Gagner la manche
      text: Sois le dernier en jeu. Ou aie la plus forte carte quand la pioche est vide.

full_rules:
  - title: But
    text: Reste le dernier en jeu. Ou aie la plus forte carte à la fin de la pioche.
  - title: Mise en place
    text: Mélange. Écarte une carte. Distribue une carte par joueur.
  - title: Un tour
    text: Pioche. Joue une carte. Applique son pouvoir.
  - title: Fin de manche
    text: Le gagnant remporte un jeton. Il en faut 7 à 2 joueurs, 5 à 3 joueurs et 4 à 4 joueurs.
  - title: Cas particuliers
    text: >-
      À 2 joueurs, pose aussi 3 cartes face visible au début. Si la pioche est vide, la plus forte carte gagne. En
      cas d’égalité, on additionne les cartes jouées.
