name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - name: Les tokens générés sont à jour
        run: git diff --exit-code -- src/styles/tokens.generated.css src/core/tokens.generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Synchronisation Capacitor (Android + iOS)
        run: npx cap sync
      - run: npx playwright install --with-deps chromium
      - name: Tests PWA (hors ligne, manifeste) et visuels
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
